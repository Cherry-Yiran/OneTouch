name: Release OneTouch

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: aarch64-apple-darwin

      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri -> target

      - run: pnpm install --frozen-lockfile

      - run: pnpm test:ui

      - run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Require stable macOS code signing
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          if [[ -z "$APPLE_CERTIFICATE" || -z "$APPLE_CERTIFICATE_PASSWORD" || -z "$APPLE_SIGNING_IDENTITY" ]]; then
            echo "Refusing to publish a build without the stable OneTouch signing identity."
            exit 1
          fi

      - name: Import stable OneTouch signing identity
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          certificate_path="$RUNNER_TEMP/onetouch-signing.p12"
          certificate_pem="$RUNNER_TEMP/onetouch-signing.pem"
          keychain_path="$RUNNER_TEMP/onetouch-signing.keychain-db"
          keychain_password="$(openssl rand -hex 32)"

          printf '%s' "$APPLE_CERTIFICATE" | /usr/bin/base64 -D > "$certificate_path"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A \
            -f pkcs12 \
            -k "$keychain_path"
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$keychain_password" \
            "$keychain_path"

          openssl pkcs12 \
            -legacy \
            -in "$certificate_path" \
            -nokeys \
            -passin env:APPLE_CERTIFICATE_PASSWORD \
            -out "$certificate_pem"
          sudo security add-trusted-cert \
            -d \
            -r trustRoot \
            -k /Library/Keychains/System.keychain \
            "$certificate_pem"

          security list-keychains -d user -s \
            "$keychain_path" \
            /Library/Keychains/System.keychain
          security default-keychain -d user -s "$keychain_path"
          security find-identity -v -p codesigning "$keychain_path" \
            | grep -F "$APPLE_SIGNING_IDENTITY"

      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        with:
          tagName: v__VERSION__
          releaseName: OneTouch v__VERSION__
          releaseBody: 完整更新日志见 CHANGELOG.md。
          generateReleaseNotes: true
          releaseDraft: true
          prerelease: false
          args: --target aarch64-apple-darwin

      - name: Verify signed release app
        run: |
          app_path="$(find src-tauri/target/aarch64-apple-darwin/release/bundle/macos -maxdepth 1 -name '*.app' -print -quit)"
          if [[ -z "$app_path" ]]; then
            echo "The packaged OneTouch app was not found."
            exit 1
          fi
          codesign --verify --deep --strict --verbose=2 "$app_path"

      - name: Verify updater manifest and downloadable artifact
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          release_version="$(jq -r .version src-tauri/tauri.conf.json)"
          release_tag="v$release_version"
          updater_dir="$RUNNER_TEMP/onetouch-updater-verification"
          mkdir -p "$updater_dir"
          gh release download "$release_tag" \
            --pattern latest.json \
            --pattern '*.app.tar.gz' \
            --pattern '*.app.tar.gz.sig' \
            --dir "$updater_dir"

          manifest="$updater_dir/latest.json"
          jq -e --arg version "$release_version" '
            .version == $version and
            (.platforms["darwin-aarch64"].url | startswith("https://")) and
            (.platforms["darwin-aarch64"].signature | length > 100)
          ' "$manifest"

          archive="$(find "$updater_dir" -maxdepth 1 -name '*.app.tar.gz' -print -quit)"
          signature_file="$archive.sig"
          test -s "$archive"
          test -s "$signature_file"
          test "$(jq -r '.platforms["darwin-aarch64"].signature' "$manifest")" = "$(cat "$signature_file")"

          manifest_url="$(jq -r '.platforms["darwin-aarch64"].url' "$manifest")"
          curl --fail --location \
            --retry 3 \
            --retry-all-errors \
            --header "Authorization: Bearer $GITHUB_TOKEN" \
            --header 'Accept: application/octet-stream' \
            "$manifest_url" \
            --output "$updater_dir/downloaded.app.tar.gz"
          cmp "$archive" "$updater_dir/downloaded.app.tar.gz"

      - name: Publish verified release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          release_tag="v$(jq -r .version src-tauri/tauri.conf.json)"
          gh release edit "$release_tag" --draft=false
